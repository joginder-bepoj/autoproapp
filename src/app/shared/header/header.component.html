<header id="app-header" class="main-header" [class.menu-open]="isMenuOpen">
  <div class="header-container container">

    <!-- Logo -->
    <div class="logo-section" [routerLink]="['/home']">
      <div class="logo-circle">
        <img src="assets/images/logo.png" alt="AutoPro Logo">
      </div>
      <span class="logo-text">AutoPro</span>
    </div>

    <!-- Navigation links -->
    <nav class="nav-links">
      <div class="nav-item" *ngFor="let item of navItems">
        <a [routerLink]="[item.route]" class="nav-item">{{item.label}}</a>
        <ion-badge color="danger" class="cart-badge"
          *ngIf="item.label === 'Cart' && cartQty > 0">{{cartQty}}</ion-badge>
      </div>
    </nav>


    <!-- Header Actions -->
    <div class="header-actions">
      <ng-container *ngIf="userProfile$ | async as user; else guest">
        <button class="action-link sign-in btn-header-cta" routerLink="/profile">
          <ion-icon name="person-circle-outline"></ion-icon>
          <span>{{ user.firstName || 'Account' }}</span>
        </button>
      </ng-container>
      <ng-template #guest>
        <button class="action-link sign-in btn-header-cta" routerLink="/login">
          <ion-icon name="person-circle-outline"></ion-icon>
          <span>Sign in</span>
        </button>
      </ng-template>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-toggle" (click)="toggleMenu()">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
    </div>

  </div>

</header>

<!-- Side Drawer Backdrop -->
<div class="side-drawer-backdrop" [class.visible]="isMenuOpen" (click)="toggleMenu()"></div>

<!-- Side Drawer -->
<div class="side-drawer" [class.open]="isMenuOpen">
  <!-- Drawer Header -->
  <div class="drawer-header">
    <div class="drawer-logo">
      <img src="assets/images/logo.png" alt="AutoPro Logo">
      <span>AutoPro</span>
    </div>
    <button class="drawer-close" (click)="toggleMenu()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <!-- User Info -->
  <a class="drawer-user" *ngIf="userProfile$ | async as user" routerLink="/profile" (click)="isMenuOpen = false">
    <div class="user-avatar">
      <ion-icon name="person-circle-outline"></ion-icon>
    </div>
    <div class="user-info">
      <div class="user-name">{{ user.firstName }} {{ user.lastName }}</div>
      <div class="user-email">{{ user.email }}</div>
    </div>
    <ion-icon name="chevron-forward-outline" class="profile-arrow"></ion-icon>
  </a>

  <!-- Nav Items -->
  <nav class="drawer-nav">
    <a *ngFor="let item of navItems" [routerLink]="[item.route]" class="drawer-nav-item" (click)="isMenuOpen = false">
      <ion-icon [name]="item.icon || 'chevron-forward-outline'"></ion-icon>
      <span>{{ item.label }}</span>
      <ion-icon name="chevron-forward-outline" class="arrow"></ion-icon>
    </a>
  </nav>

  <!-- Drawer Footer -->
  <div class="drawer-footer">
    <button class="drawer-logout" *ngIf="userProfile$ | async" (click)="logout(); isMenuOpen = false">
      <ion-icon name="log-in-outline"></ion-icon>
      <span>Logout</span>
    </button>
  </div>
</div>
