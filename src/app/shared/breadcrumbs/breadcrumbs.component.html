<div class="breadcrumbs-container">
  <nav class="breadcrumb-nav">
    <!-- Home Link -->
    <a *ngIf="!isHome" routerLink="/home" class="breadcrumb-item home-link">
      Home
    </a>

    <ng-container *ngFor="let item of breadcrumb; let last = last">
      <ion-icon name="chevron-forward-outline" class="breadcrumb-sep"></ion-icon>

      <a (click)="navigateTo(item)" class="breadcrumb-item">
        {{ item.label | titlecase }}
      </a>
    </ng-container>

  </nav>
</div>
