<ion-content>
  <div class="page-container communication-preferences-page">
    <div class="communication-preferences-container container">
      <app-breadcrumbs [breadcrumb]="breadcrumb"></app-breadcrumbs>

      <section class="preference-panel mt-3">

        <div class="preference-copy">
          <div>
            <h2>Marketing Emails</h2>
            <p>
              Subscribe to American Key Supply's marketing emails to receive the latest new product info,
              updates, and promotions.
            </p>
          </div>
        </div>

        <label class="preference-toggle">
          <span>{{ subscribe ? 'Subscribed' : 'Not subscribed' }}</span>
          <ion-toggle [(ngModel)]="subscribe" aria-label="Subscribe to marketing emails"></ion-toggle>
        </label>

        <p class="privacy-note">
          We promise communication is extremely infrequent, and your information will never be shared with or sold to
          others.
        </p>
        <div class="w-100 d-flex justify-content-end">
          <ion-button (click)="saveChanges()" class="mt-3" [disabled]="isSaving || !hasChanges">
            Save Changes
          </ion-button>
        </div>
      </section>
    </div>
  </div>

  <app-footer></app-footer>
</ion-content>
