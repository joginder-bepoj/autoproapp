<ion-content [fullscreen]="true">
  <div class="login-page">
    <div class="visual-panel">
      <div class="hero-content">
        <img src="assets/images/logo.png" alt="Logo" class="logo" />
        <h1 class="hero-title">AutoPro APP</h1>
        <p class="hero-subtitle">
          The Ultimate Resource for Automotive Locksmiths
        </p>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-container d-flex flex-column align-items-center">
        <div class="brand">
          <img
            class="m-auto mb-3"
            src="assets/images/americankeysupply.png"
            alt="American Key Supply"
          />
          <h2 class="form-title text-center">Log in to Your Account</h2>
          <p class="form-subtitle">
            Welcome back! Choose your preferred sign-in method.
          </p>
        </div>

        <div class="form-input-group">
          <ion-input
            label="Email*"
            label-placement="floating"
            fill="outline"
            placeholder="Enter your email"
          ></ion-input>
        </div>

        <div class="form-input-group">
          <ion-input
            label="Password*"
            label-placement="floating"
            fill="outline"
            type="password"
            placeholder="Enter your password"
          ></ion-input>
        </div>

        <div class="form-options w-100 mb-3">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <ion-button expand="block" class="login-btn">Sign In</ion-button>
        <p class="signup-text">
          New here? <a href="/register">Create an account</a> or
          <a href="#">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</ion-content>
