<ion-content>
<div class="page-container">
  <div class="settings-container container">

    <!-- Contact Information Card -->
    <div class="settings-card">
      <div class="section-header align-items-center">
        <div class="icon-wrapper">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="header-text">
          <h2 class="title">Contact Information</h2>
          <p class="subtitle">Please enter your details.</p>
        </div>
      </div>

      <div class="form-wrapper">
        <div class="input-group">
          <label>First Name</label>
          <div class="widget-row">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <ion-input type="text" placeholder="Enter first name"></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>Last Name</label>
          <div class="widget-row">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <ion-input type="text" placeholder="Enter last name"></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <div class="widget-row disabled">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <ion-input type="email" placeholder="test@gmail.com" disabled></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <div class="widget-row">
            <ion-icon name="call-outline" class="input-icon"></ion-icon>
            <ion-input type="text" placeholder="+1234567890"></ion-input>
          </div>
        </div>
      </div>
    </div>

    <!-- Change Password Card -->
    <div class="settings-card">
      <div class="section-header align-items-center">
        <div class="icon-wrapper">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <div class="header-text">
          <h2 class="title">Change Password</h2>
          <p class="subtitle">Update your security credentials.</p>
        </div>
      </div>

      <div class="form-wrapper">
        <div class="input-group">
          <label>Current Password</label>
          <div class="widget-row">
            <ion-icon name="key-outline" class="input-icon"></ion-icon>
            <ion-input type="password" value="........."></ion-input>
            <ion-icon name="eye-outline" class="trailing-icon"></ion-icon>
          </div>
        </div>

        <div class="input-group">
          <label>New Password</label>
          <div class="widget-row">
            <ion-icon name="lock-open-outline" class="input-icon"></ion-icon>
            <ion-input type="password" placeholder="Enter new password"></ion-input>
            <ion-icon name="eye-off-outline" class="trailing-icon"></ion-icon>
          </div>
          <div class="input-group">
            <label>Confirm Password</label>
            <div class="widget-row">
              <ion-icon name="shield-checkmark-outline" class="input-icon"></ion-icon>
              <ion-input type="password" placeholder="Confirm new password"></ion-input>
              <ion-icon name="eye-off-outline" class="trailing-icon"></ion-icon>
            </div>
          </div>
        </div>

        <div class="action-row mt-auto justify-content-end">
          <button class="btn btn-secondary me-2">
            Cancel
          </button>
          <button class="btn btn-primary">
            <ion-icon name="checkmark-outline" class="btn-icon"></ion-icon>
            Update Password
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
<app-footer></app-footer>
</ion-content>
