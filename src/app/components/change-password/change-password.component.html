<ion-content>
<div class="page-container">
  <div class="settings-container container">

    <!-- Contact Information Card -->
    <div class="settings-card">
      <div class="section-header align-items-center">
        <div class="icon-wrapper">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="header-text">
          <h2 class="title">Contact Information</h2>
          <p class="subtitle">Please enter your details.</p>
        </div>
      </div>

      <div class="form-wrapper">
        <div class="input-group">
          <label>First Name</label>
          <div class="widget-row">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="firstName" type="text" placeholder="Enter first name"></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>Last Name</label>
          <div class="widget-row">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="lastName" type="text" placeholder="Enter last name"></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <div class="widget-row">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="email" type="email" placeholder="Email address"></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <div class="widget-row">
            <ion-icon name="call-outline" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="phoneNumber" type="text" placeholder="+1234567890"></ion-input>
          </div>
        </div>
      </div>
    </div>

    <!-- Change Password Card -->
    <div class="settings-card">
      <div class="section-header align-items-center">
        <div class="icon-wrapper">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <div class="header-text">
          <h2 class="title">Change Password</h2>
          <p class="subtitle">Set a new password (optional).</p>
        </div>
      </div>

      <div class="form-wrapper">
        <div class="input-group">
          <label>New Password</label>
          <div class="widget-row">
            <ion-icon name="lock-open-outline" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="newPassword" [type]="showNew ? 'text' : 'password'" placeholder="Enter new password"></ion-input>
            <ion-icon [name]="showNew ? 'eye-off-outline' : 'eye-outline'" class="trailing-icon" (click)="showNew = !showNew"></ion-icon>
          </div>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <div class="widget-row">
            <ion-icon name="shield-checkmark-outline" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="confirmPassword" [type]="showConfirm ? 'text' : 'password'" placeholder="Confirm new password"></ion-input>
            <ion-icon [name]="showConfirm ? 'eye-off-outline' : 'eye-outline'" class="trailing-icon" (click)="showConfirm = !showConfirm"></ion-icon>
          </div>
        </div>

        <div class="action-row mt-auto justify-content-end">
          <button class="btn btn-secondary me-2" (click)="cancel()">
            Cancel
          </button>
          <button class="btn btn-primary" (click)="submit()">
            <ion-icon name="checkmark-outline" class="btn-icon"></ion-icon>
            Save Changes
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
<app-footer></app-footer>
</ion-content>
