<header class="main-header" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen">
  <div class="header-container container">

    <!-- Logo -->
    <div class="logo-section" [routerLink]="['/home']">
      <div class="logo-circle">
        <img src="assets/images/logo.png" alt="AutoPro Logo">
      </div>
      <span class="logo-text">AutoPro</span>
    </div>

    <!-- Navigation links -->
    <nav class="nav-links">
      <a *ngFor="let item of navItems" [routerLink]="[item.route]" class="nav-item">{{item.label}}</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="action-link sign-in" routerLink="/profile">
        <ion-icon name="person-circle-outline"></ion-icon>
        <span>Sign in</span>
      </button>
      <!-- <button class="btn-primary submit-btn">
        Submit Listing
      </button> -->

      <!-- Mobile Menu Toggle -->
      <button class="mobile-toggle" (click)="toggleMenu()">
        <ion-icon [name]="isMenuOpen ? 'close-outline' : 'menu-outline'"></ion-icon>
      </button>
    </div>

  </div>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <a *ngFor="let item of navItems" [routerLink]="[item.route]" (click)="isMenuOpen = false">{{item.label}}</a>
  </div>
</header>
