<ion-content>
  <div class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Add Credit Card</h3>
        <ion-button fill="clear" (click)="onCancel()" aria-label="Close add credit card modal">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button>
      </div>

      <div class="modal-body">
        <ion-input
          class="card-input"
          placeholder="Card Number"
          [(ngModel)]="cardNumber"
          (ionInput)="formatCardNumber($event)"
          inputmode="numeric"
        ></ion-input>

        <div class="row two">
          <ion-input
            class="card-input"
            placeholder="Expiry Date (MM / YYYY)"
            [(ngModel)]="expiryDate"
            inputmode="numeric"
          ></ion-input>
          <ion-input class="card-input" placeholder="CVV" [(ngModel)]="cvv" inputmode="numeric"></ion-input>
        </div>

        <div class="billing-section" *ngIf="addresses?.length">
          <div class="billing-header">Billing Address</div>
          <div class="address-list">
            <button
              type="button"
              class="address-row"
              *ngFor="let address of addresses"
              [class.selected]="isSelectedAddress(address)"
              (click)="selectBillingAddress(address)"
            >
              <span class="radio" [class.active]="isSelectedAddress(address)"></span>
              <span class="address-details">
                <strong>{{ address?.company || address?.city || 'Address' }}</strong>
                <span>{{ address?.street || address?.addressFirstLine }}</span>
                <span>
                  {{ address?.city }}<span *ngIf="address?.city && address?.state">, </span>{{ address?.state }}
                  {{ address?.postalCode }}
                </span>
                <span *ngIf="address?.phoneNumber">Phone: {{ address?.phoneNumber }}</span>
              </span>
            </button>
          </div>
        </div>

        <div class="actions">
          <ion-button expand="block" (click)="submit()" [disabled]="isSaving">
            <ion-icon slot="start" name="save-outline"></ion-icon>
            {{ isSaving ? 'Saving...' : 'Save Card' }}
          </ion-button>
          <ion-button expand="block" fill="outline" (click)="onCancel()">Cancel</ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
